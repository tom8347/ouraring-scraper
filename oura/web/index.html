<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%239ccfd8' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="today">
  <div class="backdrop"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">ŌURA<small>Personal dashboard</small></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot"><button class="sync-btn" id="sync"></button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="title">Today</h1>
        <div class="datenav" id="datenav">
          <button class="icon-btn" id="prev" title="Previous day (←)"></button>
          <label class="date-label" title="Pick a date">
            <span id="cal-icon"></span><span id="date-text">Today</span>
            <input type="date" id="date-input">
          </label>
          <button class="icon-btn" id="next" title="Next day (→)"></button>
          <button class="today-btn" id="today" title="Jump to today (T)">Today</button>
        </div>
        <span class="spacer"></span>
        <div class="range-wrap" id="range-wrap"><span>Trends</span><div class="segmented" id="ranges"></div></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
